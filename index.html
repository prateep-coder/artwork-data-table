<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artwork Data Table</title>
    
    <!-- PrimeReact Styles -->
    <link rel="stylesheet" href="https://unpkg.com/primereact/resources/themes/lara-light-cyan/theme.css" />
    <link rel="stylesheet" href="https://unpkg.com/primereact/resources/primereact.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
    <link rel="stylesheet" href="https://unpkg.com/primeflex/primeflex.css" />
    
    <!-- Custom Styles -->
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8f9fa;
      }

      .app-container {
        min-height: 100vh;
      }

      .card {
        background: #ffffff;
        padding: 1rem;
        border-radius: 6px;
        box-shadow: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14), 0 1px 3px 0 rgba(0,0,0,.12);
      }

      /* Custom checkbox styling for indeterminate state */
      .p-checkbox-indeterminate .p-checkbox-box {
        background: #3B82F6 !important;
        border-color: #3B82F6 !important;
      }

      .p-checkbox-indeterminate .p-checkbox-box:after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 2px;
        background: #ffffff;
      }

      /* Fix for overlay panel */
      .p-overlaypanel {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid #e5e7eb;
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .app-container {
          padding: 1rem !important;
        }
        
        .flex-wrap {
          flex-direction: column;
          align-items: flex-start !important;
        }
        
        .selection-info {
          margin-top: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
